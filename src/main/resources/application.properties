spring.datasource.url=jdbc:postgresql://localhost:5433/hospital_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.frontend.url=http://localhost:5173/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.resolve-lazily=true
hms.document-storage.multipart-staging-dir=${java.io.tmpdir}/hms-multipart-staging
spring.servlet.multipart.location=${hms.document-storage.multipart-staging-dir}
hms.document-storage.purge-cron=-
hms.document-storage.purge.enabled=false
